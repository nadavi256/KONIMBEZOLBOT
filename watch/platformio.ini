; Firmware for LILYGO T-Watch S3 / T-Watch S3 Plus — "personal coach" thin client.
[platformio]
boards_dir = boards

[env:twatch_s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = lilygo-t-watch-s3
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = chain+
lib_deps =
    https://github.com/Xinyuan-LilyGO/LilyGoLib.git
    lvgl/lvgl @ 9.6.0
    jgromes/RadioLib @ 7.7.1
    lewisxhe/SensorLib @ 0.5.2
    lewisxhe/XPowersLib
    bblanchon/ArduinoJson @ ^7.2.0
build_flags =
    -D ARDUINO_T_WATCH_S3
    -D ARDUINO_LILYGO_LORA_SX1262
    -D CORE_DEBUG_LEVEL=0
    -D LILYGO_DEBUG_ENABLED=0
    -D LV_CONF_INCLUDE_SIMPLE
    ; arduino-esp32 3.x WiFi needs the Network lib headers; LDF misses them here
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
