name: WhatsApp Bot - Every 20 Minutes

on:
  workflow_dispatch:
  schedule:
    # Every 20 min, 09:00–21:40 Israel time = 06:00–18:40 UTC (UTC+3)
    - cron: '0,20,40 6-18 * * *'

concurrency:
  group: whatsapp-send
  cancel-in-progress: false

jobs:
  send-whatsapp:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}
          restore-keys: playwright-chromium-
          save-always: true

      - name: Install dependencies
        timeout-minutes: 3
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: playwright install chromium --with-deps


      - name: Send products to WhatsApp groups
        timeout-minutes: 8
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          WHATSAPP_INSTANCE_ID: ${{ secrets.WHATSAPP_INSTANCE_ID }}
          WHATSAPP_API_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN }}
          WHATSAPP_GROUP_IDS: ${{ secrets.WHATSAPP_GROUP_IDS }}
        run: python bot_whatsapp.py
