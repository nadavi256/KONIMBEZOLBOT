name: WhatsApp Bot - Ramped

on:
  workflow_dispatch:
  schedule:
    # Fires every 15 min, 09:00-21:45 Israel time (UTC+3) — the cadence
    # needed for the eventual target of 4 sends/hour/group. bot_whatsapp.py
    # decides on EACH trigger whether to actually send, based on a volume
    # ramp that starts low for a brand-new number and rises to the full
    # target over ~2 weeks (see whatsapp_warmup.py) — most triggers during
    # the ramp period are expected no-ops by design, not failures.
    #
    # Minutes are offset (not :00/:15/:30/:45) on purpose: GitHub's own
    # docs warn schedule triggers queue behind everyone else's jobs hardest
    # at those exact marks, since every repo on GitHub defaults to them.
    - cron: '7,22,37,52 6-18 * * *'

concurrency:
  group: whatsapp-send
  cancel-in-progress: false

jobs:
  send-whatsapp:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}
          restore-keys: playwright-chromium-
          save-always: true

      - name: Install dependencies
        timeout-minutes: 3
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: playwright install chromium --with-deps


      - name: Send products to WhatsApp groups
        timeout-minutes: 12
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          WHATSAPP_INSTANCE_ID: ${{ secrets.WHATSAPP_INSTANCE_ID }}
          WHATSAPP_API_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN }}
          WHATSAPP_GROUP_IDS: ${{ secrets.WHATSAPP_GROUP_IDS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python bot_whatsapp.py
