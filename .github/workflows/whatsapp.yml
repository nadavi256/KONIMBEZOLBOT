name: WhatsApp Bot - 5x Daily

on:
  workflow_dispatch:
  schedule:
    # 5 fixed, non-round times/day (Israel time, UTC+3) instead of a tight
    # 20-min loop — a WhatsApp account sending on a dense fixed interval to
    # multiple groups reads as automated. Times are IL 09:41 / 12:17 /
    # 14:53 / 17:26 / 20:08, converted to UTC below. A per-run daily cap in
    # bot_whatsapp.py (WHATSAPP_DAILY_CAP) is the hard backstop.
    - cron: '41 6 * * *'
    - cron: '17 9 * * *'
    - cron: '53 11 * * *'
    - cron: '26 14 * * *'
    - cron: '8 17 * * *'

concurrency:
  group: whatsapp-send
  cancel-in-progress: false

jobs:
  send-whatsapp:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}
          restore-keys: playwright-chromium-
          save-always: true

      - name: Install dependencies
        timeout-minutes: 3
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: playwright install chromium --with-deps


      - name: Send products to WhatsApp groups
        timeout-minutes: 12
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          WHATSAPP_INSTANCE_ID: ${{ secrets.WHATSAPP_INSTANCE_ID }}
          WHATSAPP_API_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN }}
          WHATSAPP_GROUP_IDS: ${{ secrets.WHATSAPP_GROUP_IDS }}
        run: python bot_whatsapp.py
