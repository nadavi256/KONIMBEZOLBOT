name: Telegram Bot - Every 15 Minutes

on:
  workflow_dispatch:   # cron-job.org trigger (primary)

concurrency:
  group: send-products
  cancel-in-progress: false   # don't cancel running job, just queue

jobs:
  send-products:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}
          restore-keys: playwright-chromium-
          save-always: true   # save cache even if later steps fail

      - name: Install dependencies
        timeout-minutes: 3
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: playwright install chromium --with-deps


      - name: Send products to Telegram
        timeout-minutes: 8
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: "-1002004379375"
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python bot.py send-now
