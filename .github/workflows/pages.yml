name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dashboard.html'
      - 'dashboard-whatsapp.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy dashboard to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          git rm -rf . --quiet 2>/dev/null || true
          git checkout main -- dashboard.html dashboard-whatsapp.html
          touch .nojekyll
          git add dashboard.html dashboard-whatsapp.html .nojekyll
          git commit -m "chore: update dashboard" || echo "Nothing to commit"
          git push origin gh-pages
